name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'tag to release (e.g. v1.3.9)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # A hung step must not sit on github's 6h default. v1.7.59 and v1.7.60 both
    # did exactly that — the pre-build test gate wedged, the job burned six
    # hours, and NEITHER tag ever produced release assets, so the self-dist xpi
    # and the README download links silently kept serving an older build. Fail
    # in minutes and loudly instead.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: install
        run: bun install --frozen-lockfile

      - name: build + package
        run: bun run build.js --package

      - name: derive version
        id: ver
        run: |
          v=$(node -e "console.log(require('./chrome/manifest.json').version)")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

      - name: stage versionless chrome alias for README links
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          cp "dist/heatsync-chrome-${VERSION}.zip" dist/heatsync-chrome.zip

      - name: sign firefox xpi (AMO self-distribution)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          VERSION: ${{ steps.ver.outputs.version }}
          UPDATES_URL: https://github.com/mellen9999/heatsync-extension/releases/latest/download/updates.json
          XPI_URL: https://github.com/mellen9999/heatsync-extension/releases/latest/download/heatsync-firefox.xpi
        run: |
          # Upload dist/firefox to AMO, wait for automated unlisted signing, then
          # publish the signed .xpi as the versionless alias. Fails loud if signing
          # fails — release Firefox refuses to install an unsigned xpi, so we never
          # ship the bare zip renamed to .xpi (the old bug).
          # AMO version numbers are single-use ACROSS channels: the listed store
          # submission (scripts/publish.js, run before tagging) owns the clean
          # X.Y.Z, so this unlisted self-dist build signs as X.Y.Z.1 — the two
          # can never collide and release order stops mattering. (1.7.24/1.7.25
          # burned the clean number unlisted and 409-blocked the store channel;
          # the suffix only shows in about:addons for direct-xpi installs.)
          # update_url lives ONLY in this self-dist build: AMO rejects it on the
          # listed channel, and without it a direct-xpi install never updates
          # itself — 1.7.44.1 installs sat frozen while the store moved on.
          # The alias URLs always resolve to the newest release's assets.
          SIGN_VERSION="${VERSION}.1"
          jq --arg v "$SIGN_VERSION" --arg u "$UPDATES_URL" \
            '.version = $v | .browser_specific_settings.gecko.update_url = $u' \
            dist/firefox/manifest.json > /tmp/fxman.json
          mv /tmp/fxman.json dist/firefox/manifest.json
          jq -n --arg v "$SIGN_VERSION" --arg link "$XPI_URL" '
            {addons: {"heatsync@heatsync.org": {updates: [
              {version: $v, update_link: $link, browser_specific_settings: {gecko: {strict_min_version: "128.0"}}}
            ]}}}' > dist/updates.json
          # web-ext can 409 against its OWN submission ("version already exists")
          # when validation polling races the upload — the version record is live
          # on AMO and signs server-side regardless. Fall back to downloading the
          # signed file for this exact version instead of failing the release.
          if ! bunx web-ext@10.4.0 sign \
            --source-dir dist/firefox \
            --channel unlisted \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET" \
            --artifacts-dir dist/signed \
            --timeout 900000 \
            --no-input; then
            echo "web-ext sign failed — trying to fetch already-signed ${SIGN_VERSION} from AMO"
            mkdir -p dist/signed
            bun scripts/amo-fetch-signed.js "$SIGN_VERSION" "dist/signed/heatsync-${SIGN_VERSION}.xpi"
          fi
          signed=$(ls dist/signed/*.xpi 2>/dev/null | head -1)
          if [ -z "$signed" ]; then echo "::error::no signed xpi produced"; exit 1; fi
          cp "$signed" dist/heatsync-firefox.xpi

      - name: create release + attach assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          notes=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$notes" ]; then
            notes="release $TAG"
          fi
          # sha256 checksums so anyone can self-verify the published artifacts
          ( cd dist && sha256sum \
              "heatsync-chrome-${VERSION}.zip" \
              "heatsync-firefox-${VERSION}.zip" \
              "heatsync-source-${VERSION}.zip" > checksums.txt )
          notes="$(printf '%s\n\n### sha256\n```\n%s\n```\n' "$notes" "$(cat dist/checksums.txt)")"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$notes" \
            "dist/heatsync-chrome-${VERSION}.zip" \
            "dist/heatsync-firefox-${VERSION}.zip" \
            "dist/heatsync-source-${VERSION}.zip" \
            dist/heatsync-chrome.zip \
            dist/heatsync-firefox.xpi \
            dist/updates.json \
            dist/checksums.txt
