name: ci

# PR + manual dispatch only — push triggers disabled to conserve Actions
# minutes during solo pre-launch work. Re-enable after June 1 reset if needed.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # The paint-compiler parity gate needs the site repo checked out beside
      # this one. It is private until the flip, so this runner cannot have it;
      # the gate refuses to skip quietly anywhere this is not set.
      HS_PARITY_SKIP_OK: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: install dependencies
        # Strict frozen install — no fallback. A drifted/poisoned lockfile must
        # fail the build loudly, not silently resolve to un-pinned deps. Matches
        # release.yml; keep the two in sync.
        run: bun install --frozen-lockfile

      # --minify is how the tracked chrome/ bundle is built (a plain build is
      # ~220KB larger and would never match it).
      - name: build
        run: bun run build.js --minify

      # Per-file + total bytes against scripts/bundle-budgets.json. Needs the
      # firefox build too (the chrome one above is the tracked one).
      - name: bundle size budget
        run: |
          bun run build.js firefox --minify
          bun scripts/check-bundle-budget.ts

      # The tracked bundle is the build of this src/ — a src edit that shipped
      # without a rebuild (1.7.75) fails here, in the open, instead of on a
      # user's tab.
      - name: tracked bundle matches this build
        run: git diff --exit-code --stat -- chrome/

      - name: test
        run: bun test

      - name: lint
        run: bunx @biomejs/biome check src/ chrome/ tests/ build.js

      - name: typecheck
        run: bun run typecheck

      # The root typecheck has checkJs:false and excludes chrome/ and
      # src/multichat/ — about 95% of the product. This one checks the BUILT
      # output (the concatenation is what actually has to resolve) and holds
      # the crash-class errors at zero. `build` above already produced
      # dist/chrome, so this only runs tsc.
      - name: Built-extension crash-class typecheck
        run: node scripts/type-signal.mjs

      - name: check version sync
        run: bun tests/check-versions.js

      # Load the built extension in a real browser and prove it starts: a
      # bundle that throws on evaluation, a manifest the browser rejects, a
      # service worker that dies on registration — nothing above sees those.
      # Branded google-chrome ignores --load-extension (since chrome 137), so the
      # MV3 service worker never starts and every launch times out waiting for
      # it (first nightly, 2026-10-14). Playwright's own chromium still honours
      # the flag; install the build matching the pinned playwright-core.
      - name: install chromium
        run: |
          bunx playwright-core install chromium
          echo "CHROMIUM_BIN=$(bun -e "console.log(require('playwright-core').chromium.executablePath())")" >> "$GITHUB_ENV"

      - name: smoke (built extension boots in chrome)
        run: bun scripts/smoke-extension.ts

  notify-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build-and-test
    # A PR check is attended work — its author is looking at the red tick — so
    # the only run worth ringing a phone about is a merge that broke main.
    #
    # `github.ref` alone could not express that, and quietly expressed the
    # inverse: on a `pull_request` event the ref is `refs/pull/<n>/merge`, never
    # `refs/heads/main`, so the old gate was false for every PR and true only
    # for a HAND DISPATCH off main — the one run nobody needs telling about
    # (2026-10-14: that is what the `ext ci FAILED branch main` page was).
    # Naming the event as well as the ref is what makes it mean what it says.
    #
    # Push triggers are off in this repo to conserve Actions minutes (see the
    # note on `on:`), so this job cannot fire at all today, and a red main here
    # is invisible by that deliberate choice rather than by this gate. Written
    # for the day pushes come back, so it does not have to be remembered then.
    #
    # `cancelled()` too: a job killed by its own timeout-minutes concludes
    # `cancelled`, so a bare `failure()` is skipped and a HANG pages nobody
    # (nightly-heap run 38505736893, 15m23s, silent). No concurrency group
    # here, so nothing supersedes a run and `cancelled` can only be its own
    # ceiling or a hand cancel.
    if: ${{ (failure() || cancelled()) && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: spool alert
        run: |
          code=$(curl -sS -m 10 -o /dev/null -w '%{http_code}' -X POST \
            "https://heatsync.org/api/ops/intake/ci" \
            -H "Authorization: Bearer ${{ secrets.OPS_INTAKE_KEY }}" \
            -H 'content-type: application/json' \
            -d "{\"workflow\":\"ext ${{ github.workflow }}\",\"run_id\":\"${{ github.run_id }}\",\"attempt\":\"${{ github.run_attempt }}\",\"branch\":\"${{ github.ref_name }}\",\"sha\":\"${{ github.sha }}\"}" \
            || echo 000)
          if [ "$code" = 204 ]; then
            echo "::notice::ops-intake accepted the ext alert"
          else
            echo "::error::ops-intake refused the ext alert (HTTP $code) — check that secrets.OPS_INTAKE_KEY matches OPS_INTAKE_KEY in prod's .env"
          fi
