<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>heatsync</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: monospace, 'Noto Color Emoji';
      font-size: 13px;
      line-height: 1.5;
      font-kerning: normal;
      font-feature-settings: "kern" 1, "liga" 1, "calt" 1;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }
    main {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
    }
    header img { width: 48px; height: 48px; }
    h1 {
      font-size: 18px;
      font-weight: 400;
    }
    .cta {
      width: 100%;
      max-width: 340px;
      align-self: center;
      padding: 10px 20px;
      background: #fff;
      color: #000;
      text-decoration: none;
      text-align: center;
      font-size: 15px;
      border: 1px solid #fff;
    }
    .cta:hover, .cta:focus-visible {
      background: #fff;
      color: #000;
      border-color: #fff;
      outline: none;
    }
    .cta-close {
      align-self: center;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      background: #000;
      color: #fff;
      border: 1px solid #fff;
      padding: 8px 16px;
    }
    .cta-close:hover, .cta-close:focus-visible {
      background: #fff;
      color: #000;
      outline: none;
    }
    .explain { text-align: center; }
    .ok { color: #00ff00; font-size: 15px; text-align: center; }
    [hidden] { display: none !important; }
    footer {
      display: flex;
      gap: 12px;
      justify-content: center;
      color: #ffffff;
    }
    footer a { color: #ffffff; text-decoration: underline; }
    footer a:hover, footer a:focus-visible {
      background: #fff;
      color: #000;
      outline: none;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <img src="icon-48.png" alt="">
      <h1 data-i18n="welcome_title">heatsync</h1>
    </header>

    <p class="explain" data-i18n="welcome_explain">sign in to heatsync.org to use your emotes and settings in every chat</p>

    <a class="cta" data-when="out" href="https://heatsync.org/api/auth/login?return_to=%2F"
       target="_blank" rel="noopener" data-i18n="welcome_cta_kick">sign in →</a>

    <p class="ok" data-when="in" hidden><span class="check">✓</span> <span data-i18n="welcome_done_title">you're in</span></p>

    <button type="button" class="cta-close" id="hs-close-btn" data-i18n="welcome_close">close</button>

    <footer>
      <a href="https://heatsync.org/legal/privacy" target="_blank" rel="noopener" data-i18n="welcome_privacy">privacy</a>
      ·
      <a href="https://github.com/mellen9999/heatsync-extension" target="_blank" rel="noopener" data-i18n="welcome_source">source</a>
    </footer>
  </main>

  <script src="welcome.js"></script>
</body>
</html>
