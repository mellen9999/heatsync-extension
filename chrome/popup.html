<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=300">
  <title>heatsync</title>
  <style>
    @font-face {
      font-family: 'CozetteVector';
      src: url('fonts/CozetteVector.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #000; }
    body {
      width: 300px;
      color: #fff;
      font-family: 'CozetteVector', monospace, 'Noto Color Emoji';
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: none;
      font-smooth: never;
      text-rendering: optimizeSpeed;
      font-kerning: normal;
      font-feature-settings: "kern" 1, "liga" 1, "calt" 1;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid #1c1c1c;
    }
    .header img { width: 22px; height: 22px; }
    .brand {
      font-size: 13px;
      font-weight: 400;
    }

    .body { padding: 12px 16px; }

    .input {
      width: 100%;
      padding: 10px 12px;
      background: #000;
      color: #fff;
      border: 1px solid #808080;
      border-radius: 0;
      font-size: 13px;
      font-family: inherit;
      outline: none;
    }
    .input::placeholder { color: #aaa; }
    .input:focus { border-color: #fff; }

    .btn {
      width: 100%;
      margin-top: 10px;
      padding: 10px 12px;
      background: #fff;
      color: #000;
      border: none;
      font-size: 13px;
      font-weight: 400;
      font-family: inherit;
      cursor: pointer;
    }
    .btn:hover { background: #fff; color: #000; }
    .btn:active { background: #fff; color: #000; }

    .plat-pick {
      display: flex;
      margin-bottom: 10px;
      border: 1px solid #808080;
    }
    .plat {
      flex: 1;
      padding: 8px 0;
      background: #000;
      color: #808080;
      border: none;
      border-right: 1px solid #808080;
      font-family: inherit;
      font-size: 13px;
      line-height: 1;
      cursor: pointer;
    }
    .plat:last-child { border-right: none; }
    .plat:hover { background: #fff; color: #000; }
    .plat[aria-selected="true"] { background: #fff; color: #000; }

    .detected {
      margin-top: 12px;
      font-size: 13px;
      color: #888;
      text-align: center;
      min-height: 16px;
    }
    .detected b { color: #fff; font-weight: 400; }

    .not-signed-in {
      margin-bottom: 12px;
      padding: 10px 12px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      font-size: 13px;
      color: #bbb;
      text-align: center;
    }
    .not-signed-in a {
      color: #fff;
      text-decoration: underline;
    }
    .not-signed-in a:hover {
      color: #fff;
    }


    .fb-pane {
      padding: 12px 16px;
      border-top: 1px solid #1c1c1c;
    }
    .fb-text {
      resize: vertical;
      min-height: 64px;
      display: block;
    }

    .footer {
      display: flex;
      border-top: 1px solid #1c1c1c;
    }
    .footer a {
      flex: 1;
      padding: 10px 12px;
      color: #888;
      font-size: 13px;
      text-decoration: none;
      text-align: center;
      cursor: pointer;
    }
    .footer a + a { border-left: 1px solid #1c1c1c; }
    .footer a:hover { background: #fff; color: #000; }

    .inv-line {
      padding: 5px 16px;
      border-bottom: 1px solid #1c1c1c;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
    }
    .inv-count { color: #fff; }
    .inv-label { color: #808080; }
  </style>
</head>
<body>
  <div class="header">
    <img src="icon-48.png" alt="">
    <span class="brand">heatsync</span>
  </div>

  <div id="inv-line" class="inv-line"></div>

  <div class="body">
    <div class="not-signed-in" id="not-signed-in" hidden>
      <span data-i18n="popup_not_signed_in">not signed in — </span><a href="#" id="setup-link" data-i18n="popup_setup_link">set up heatsync →</a>
    </div>
    <div class="plat-pick" id="plat-pick" role="tablist">
      <button type="button" class="plat" data-plat="twitch" role="tab" aria-selected="true">twitch</button>
      <button type="button" class="plat" data-plat="kick" role="tab" aria-selected="false">kick</button>
      <button type="button" class="plat" data-plat="youtube" role="tab" aria-selected="false">youtube</button>
    </div>
    <input type="text" class="input" id="popout-input" placeholder="channel or url" data-i18n-ph="popup_channel_placeholder" spellcheck="false" autocomplete="off">
    <button class="btn" id="popout-btn" data-i18n="popup_btn_popout">popout chat</button>
    <div class="detected" id="detected"></div>
  </div>


  <div class="fb-pane" id="fb-pane" hidden>
    <div class="plat-pick" id="fb-kind" role="tablist">
      <button type="button" class="plat" data-kind="feedback" role="tab" aria-selected="true">feedback</button>
      <button type="button" class="plat" data-kind="bug" role="tab" aria-selected="false">bug</button>
    </div>
    <textarea class="input fb-text" id="fb-text" rows="4" maxlength="4000" placeholder="what should heatsync do better?" spellcheck="true"></textarea>
    <button class="btn" id="fb-send">send</button>
    <div class="detected" id="fb-status"></div>
  </div>

  <div class="footer">
    <a id="link-site" href="https://heatsync.org" target="_blank" rel="noopener noreferrer">heatsync.org</a>
    <a id="link-privacy" href="https://heatsync.org/legal/privacy" target="_blank" rel="noopener noreferrer" data-i18n="popup_privacy_link">no third-party tracking</a>
    <a id="link-errors" href="#" title="left-click: copy last 50 errors / right-click: clear" data-i18n-title="popup_errors_title">errors (0)</a>
    <a id="link-feedback" href="#" title="feedback / bug report">feedback</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
