<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>heatsync</title>
  <style>
    @font-face {
      font-family: 'CozetteVector';
      src: url('fonts/CozetteVector.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: 'CozetteVector', monospace, 'Noto Color Emoji';
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: none;
      font-smooth: never;
      text-rendering: optimizeSpeed;
      font-kerning: normal;
      font-feature-settings: "kern" 1, "liga" 1, "calt" 1;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }
    main {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
    }
    header img { width: 48px; height: 48px; }
    h1 {
      font-size: 18px;
      font-weight: 400;
    }
    .cta {
      width: 100%;
      max-width: 340px;
      align-self: center;
      padding: 10px 20px;
      background: #fff;
      color: #000;
      text-decoration: none;
      text-align: center;
      font-size: 15px;
      border: 1px solid #fff;
    }
    .cta:hover, .cta:focus-visible {
      background: #fff;
      color: #000;
      border-color: #fff;
      outline: none;
    }
    .cta-kick {
      color: #fff;
      text-decoration: none;
      align-self: center;
      font-size: 13px;
      border: 1px solid #fff;
      padding: 8px 16px;
    }
    .cta-kick:hover, .cta-kick:focus-visible {
      background: #fff;
      color: #000;
      outline: none;
    }
    .done {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      text-align: center;
    }
    .done .ok { color: #00ff00; font-size: 15px; }
    .done p { color: #ffffff; }
    .done a {
      color: #fff;
      text-decoration: none;
      margin-top: 6px;
      display: inline-block;
      border: 1px solid #fff;
      padding: 8px 16px;
      font-size: 13px;
    }
    .done a:hover, .done a:focus-visible {
      background: #fff;
      color: #000;
      outline: none;
    }
    .import-step {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      text-align: center;
      border-top: 1px solid #ffffff;
      border-bottom: 1px solid #ffffff;
      padding: 16px 0;
    }
    .import-step .import-title { font-size: 15px; }
    .import-step .import-sub { color: #ffffff; }
    .import-step .import-locked { color: #ffffff; }
    .import-step .import-locked a { color: #fff; }
    #hs-import-btn {
      font: inherit;
      cursor: pointer;
    }
    #hs-import-btn.ok { border-color: #00ff00; color: #00ff00; }
    #hs-import-btn.err { border-color: #ff0000; color: #ff0000; }
    [hidden] { display: none !important; }
    footer {
      display: flex;
      gap: 12px;
      justify-content: center;
      color: #ffffff;
    }
    footer a { color: #ffffff; text-decoration: underline; }
    footer a:hover, footer a:focus-visible {
      background: #fff;
      color: #000;
      outline: none;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <img src="icon-48.png" alt="">
      <h1 data-i18n="welcome_title">heatsync</h1>
    </header>

    <section class="import-step">
      <p class="import-title" data-i18n="welcome_import_title">bring your emotes</p>
      <p class="import-sub" data-i18n="welcome_import_sub">one-click import from 7tv, bttv &amp; ffz</p>
      <p class="import-locked" data-when="out" data-i18n="welcome_import_locked">sign in below to import your existing 7tv/bttv/ffz emotes</p>
      <button type="button" class="cta-kick" id="hs-import-btn" data-when="in" hidden data-i18n="welcome_import_cta">import my emotes →</button>
    </section>

    <a class="cta" data-when="out" href="https://www.twitch.tv/"
       target="_blank" rel="noopener" data-i18n="welcome_cta">open twitch →</a>

    <a class="cta-kick" data-when="out" href="https://heatsync.org/api/auth/login?return_to=%2F"
       target="_blank" rel="noopener" data-i18n="welcome_cta_kick">sign in →</a>

    <section class="done" data-when="in" hidden>
      <p class="ok"><span class="check">✓</span> <span data-i18n="welcome_done_title">you're in</span></p>
      <a href="https://www.twitch.tv/" target="_blank" rel="noopener">open twitch →</a>
    </section>

    <footer>
      <a href="https://heatsync.org/legal/privacy" target="_blank" rel="noopener" data-i18n="welcome_privacy">privacy</a>
      ·
      <a href="https://github.com/mellen9999/heatsync-extension" target="_blank" rel="noopener" data-i18n="welcome_source">source</a>
    </footer>
  </main>

  <script src="welcome.js"></script>
</body>
</html>
